<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Añade productos</h1>
    <form action="" id="miform">
        <input type="text" id="producto" placeholder="Producto">
        <input type="number" id="precio" placeholder="Precio">
        <button type="submit" id="carrito">Añadir Carrito</button>
        
        <div id="ponercarrito">
            <h2>Carrito de la compra</h2>
        </div>
        
        <input type="text" id="prodElim" placeholder="prodElim">
        <button type="button" id="eliminar">Eliminar</button>
    </form>

</body>
<script>
    let carrito = [];

    function añadir(producto, precio){
        carrito.push({ nombre: producto, precio: precio });
    }

    function eliminar(prodElim){
        if(prodElim.trim() !== ""){
            carrito = carrito.filter(p => p.nombre != prodElim);
        }
    }

    function mostrar(carrito){
        let poner = document.getElementById("ponercarrito");
        poner.innerHTML = "<h2>Carrito de la compra</h2>"; // limpiar antes de mostrar

        carrito.forEach(elemento => {
            const p = document.createElement("p");
            p.textContent = elemento.nombre + "--" + elemento.precio + " $";
            poner.appendChild(p);
        });
    }

    let form = document.getElementById("miform");

    // Añadir producto
    form.addEventListener("submit", function(evento){
        evento.preventDefault();

        let producto = document.getElementById("producto").value;
        let precio = parseFloat(document.getElementById("precio").value); // convertir a número

        añadir(producto, precio);
        mostrar(carrito);

        document.getElementById("producto").value = "";
        document.getElementById("precio").value = "";
    });

    // Eliminar producto
    document.getElementById("eliminar").addEventListener("click", function(){
        let prodElim = document.getElementById("prodElim").value;
        eliminar(prodElim);
        mostrar(carrito);
        document.getElementById("prodElim").value = "";
    });
</script>
</html>
