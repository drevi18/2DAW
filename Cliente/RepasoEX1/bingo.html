<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Bingo</title>
<style>
  body { font-family: Arial; text-align:center; }
  #carton {
    display:grid;
    grid-template-columns: repeat(5,50px);
    gap:4px;
    justify-content:center;
    margin:20px auto;
  }
  .num {
    width:50px; height:50px;
    border:1px solid #333;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#eee;
    font-size:20px;
  }
  .marcado { background:gold; }
</style>
</head>
<body>

<h2>Bingo</h2>
<button onclick="sacar()">Sacar número</button>
<p id="ultimo"></p>

<div id="carton"></div>

<script>
const carton = document.getElementById("carton");
let nums = [];

while(nums.length < 25){
  let n = Math.floor(Math.random()*75)+1;
  if(!nums.includes(n)) nums.push(n);
}

nums.forEach(n=>{
  let d=document.createElement("div");
  d.className="num";
  d.textContent=n;
  carton.appendChild(d);
});

let sacados = [];

function sacar(){
  if(sacados.length>=75){ alert("No quedan números"); return;}
  let n;
  do { n=Math.floor(Math.random()*75)+1; }
  while(sacados.includes(n));

  sacados.push(n);
  document.getElementById("ultimo").textContent="Salió: "+n;

  [...document.querySelectorAll(".num")].forEach(c=>{
    if(Number(c.textContent)==n) c.classList.add("marcado");
  });
}
</script>

</body>
</html>
