<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ahorcado</title>
<style>
  body{font-family:Arial;padding:20px}
  #palabra{font-size:30px;letter-spacing:6px;margin:10px 0}
  #teclado button{margin:4px;padding:6px 10px}
</style>
</head>
<body>
<h2>Ahorcado</h2>

<p id="estado"></p>
<p id="palabra"></p>
<div id="teclado"></div>
<p id="mensaje"></p>
<button id="nuevo">Nueva palabra</button>

<script>
(() => {
  const palabras = ["programa","teclado","ordenador","pantalla","javascript","internet","gato","estrellas","codigo"];
  let secreta = "";
  let aciertos = new Set();
  let fallos = 0;
  const maxFallos = 6;

  function nueva(){
    secreta = palabras[Math.floor(Math.random()*palabras.length)];
    aciertos.clear();
    fallos = 0;
    dibujarTeclado();
    actualizar();
    mensaje.textContent = "";
  }

  const estado = document.getElementById("estado");
  const palab = document.getElementById("palabra");
  const teclado = document.getElementById("teclado");
  const mensaje = document.getElementById("mensaje");

  function dibujarTeclado(){
    teclado.innerHTML="";
    for (let i=0;i<26;i++){
      const letra = String.fromCharCode(97+i);
      const b = document.createElement("button");
      b.textContent = letra;
      b.onclick = () => jugar(letra, b);
      teclado.appendChild(b);
    }
  }

  function jugar(l, btn){
    btn.disabled = true;
    if (secreta.includes(l)){
      aciertos.add(l);
      if (haGanado()){
        mensaje.textContent = "¡Has ganado! 🎉";
        desactivarTeclado();
      }
    } else {
      fallos++;
      if (fallos >= maxFallos){
        mensaje.textContent = `Has perdido. La palabra era: ${secreta}`;
        palab.textContent = secreta.split("").join(" ");
        desactivarTeclado();
      }
    }
    actualizar();
  }

  function haGanado(){
    for (let ch of secreta) if (!aciertos.has(ch)) return false;
    return true;
  }

  function actualizar(){
    palab.textContent =
      secreta.split("").map(c => aciertos.has(c) ? c : "_").join(" ");
    estado.textContent = `Aciertos: ${aciertos.size} — Fallos: ${fallos}/${maxFallos}`;
  }

  function desactivarTeclado(){
    teclado.querySelectorAll("button").forEach(b => b.disabled = true);
  }

  document.getElementById("nuevo").onclick = nueva;
  nueva();
})();
</script>
</body>
</html>
