<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sudoku</title>
<style>
  body { font-family: Arial; text-align:center; }
  #sudoku {
    display:grid;
    grid-template-columns: repeat(9,40px);
    gap:2px;
    justify-content:center;
    margin-top:20px;
  }
  input {
    width:40px; height:40px;
    text-align:center;
    font-size:20px;
  }
</style>
</head>
<body>

<h2>Sudoku (validación por filas)</h2>
<button onclick="validar()">Validar</button>
<p id="msg"></p>

<div id="sudoku"></div>

<script>
// Crear tablero vacío
const board=document.getElementById("sudoku");
for(let i=0;i<81;i++){
  let inp=document.createElement("input");
  inp.maxLength=1;
  inp.oninput=()=>inp.value=inp.value.replace(/[^1-9]/,'');
  board.appendChild(inp);
}

function validar(){
  let celdas=[...document.querySelectorAll("input")];
  // Validamos solo filas para simplicidad
  for(let f=0;f<9;f++){
    let fila=[];
    for(let c=0;c<9;c++){
      let val=celdas[f*9+c].value;
      if(val && fila.includes(val)){
        document.getElementById("msg").textContent="Fila "+(f+1)+" incorrecta";
        return;
      }
      fila.push(val);
    }
  }
  document.getElementById("msg").textContent="No hay errores de fila";
}
</script>

</body>
</html>
