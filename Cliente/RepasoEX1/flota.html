<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Hundir la Flota</title>
<style>
  body { font-family: Arial; text-align:center; }
  #tablero {
    display:grid;
    grid-template-columns: repeat(8,40px);
    gap:4px;
    justify-content:center;
    margin-top:20px;
  }
  .casilla {
    width:40px; height:40px;
    background:#bcd;
    border:1px solid #789;
    cursor:pointer;
  }
  .agua { background:#7ec0ee; }
  .tocado { background:#e55; }
</style>
</head>
<body>

<h2>Hundir la flota</h2>
<p>Haz clic para disparar</p>

<div id="tablero"></div>

<script>
// Crear tablero
const tablero = document.getElementById("tablero");
const size = 8;
let barco = { x: Math.floor(Math.random()*size), 
              y: Math.floor(Math.random()*size) };

for (let y=0; y<size; y++){
  for (let x=0; x<size; x++){
    let c = document.createElement("div");
    c.className = "casilla";
    c.dataset.x = x;
    c.dataset.y = y;

    c.onclick = () => {
      if (x == barco.x && y == barco.y){
        c.classList.add("tocado");
        alert("¡Barco hundido!");
      } else {
        c.classList.add("agua");
      }
      c.onclick = null;
    };

    tablero.appendChild(c);
  }
}
</script>

</body>
</html>
