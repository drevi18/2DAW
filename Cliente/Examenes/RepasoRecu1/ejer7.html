<script>
    const stock = [
    { modelo: "iPhone 15", precio: 1000, marca: "Apple" },
    { modelo: "Galaxy S23", precio: 800, marca: "Samsung" },
    { modelo: "Redmi Note", precio: 300, marca: "Xiaomi" },
    { modelo: "iPhone 13", precio: 600, marca: "Apple" }
];

const soloApple = stock.filter(stock => stock.marca == "Apple");
console.log(soloApple);

const preciosConIVA = soloApple.map(soloApple => (soloApple.precio *21 /100) +soloApple.precio );
console.log(preciosConIVA);

const totApp = preciosConIVA.reduce((acc,p) => acc + p, 0);
console.log(totApp);

</script>
